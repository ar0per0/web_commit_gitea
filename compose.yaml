services:
  workspace:
    build: .
    image: web_commit_gitea:local
    init: true
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8804}:8804"
    environment:
      HOST: "0.0.0.0"
      DATA_PATH: "/data"
      TZ: "${TZ:-Europe/Madrid}"
      WEB_PASSWORD: "${WEB_PASSWORD:?Configura WEB_PASSWORD en .env}"
      GITEA_USER: "${GITEA_USER:-}"
      GITEA_EMAIL: "${GITEA_EMAIL:-}"
      GITEA_TOKEN: "${GITEA_TOKEN:-}"
      GITEA_URL: "${GITEA_URL:-}"
    volumes:
      - "${DATA_PATH:-./data}:/data"
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
